[project]
name = "palindrome-rnn"
version = "0.1.0"
description = "Vanilla RNN for palindrome number recognition"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "matplotlib>=3.7.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
